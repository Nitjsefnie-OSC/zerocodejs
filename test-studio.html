<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroCode.js デモ - 専用パーツを編集する画面（zcode-studio）</title>

    <!-- 共通CSS（リセットCSS含む） -->
    <link rel="stylesheet" href="./css/common.css" />
    <!-- ページ専用CSS -->
    <link rel="stylesheet" href="./css/page.css" />
    <!-- サンプルデータ用CSS -->
    <link rel="stylesheet" href="./css/sample.css" />
  </head>
  <body>
    <div class="l-header l-header--dev">
      <div class="l-header-utility">
        <a class="demo-back-link" href="./index.html#demo" aria-label="デモ一覧へ戻る">
          <span aria-hidden="true">←</span>
          <span class="demo-util-label">デモ一覧へ戻る</span>
        </a>
        <div class="demo-help">
          <button
            type="button"
            class="demo-help-btn"
            aria-expanded="false"
            aria-controls="demo-help-popover-studio"
            aria-label="使い方"
          >
            <svg
              aria-hidden="true"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <path d="M12 17h.01" />
            </svg>
            <span class="demo-util-label">使い方</span>
          </button>
          <div
            id="demo-help-popover-studio"
            class="demo-help-popover"
            role="region"
            aria-label="このデモで試せること"
            hidden
          >
            <span class="demo-guide-title">このデモで試せること</span>
            <ol class="demo-guide-steps">
              <li>「パーツ管理」を開き、編集できるのが「専用」カテゴリだけであることを確認</li>
              <li>ページ管理はコンテンツ担当者向け（zcode-cms）と同じ操作感で編集可能</li>
              <li>
                保存時の <code>save-request</code> は
                <code>source: 'studio'</code> で発火（サーバー側の権限チェック用）
              </li>
            </ol>
          </div>
        </div>
      </div>
      <h1>専用パーツを編集する画面（zcode-studio）</h1>
      <p>専用パーツ・専用CSS・専用画像のみ編集可能。共通・個別パーツは読み取り専用</p>
    </div>

    <div class="l-container" role="main">
      <zcode-studio id="test-cms" locale="ja">
        <!-- 共通CSS（リセットCSS含む） -->
        <link slot="css" rel="stylesheet" href="./css/common.css" />
        <!-- ページ専用CSS -->
        <link slot="css" rel="stylesheet" href="./css/page.css" />
        <!-- サンプルデータ用CSS -->
        <link slot="css" rel="stylesheet" href="./css/sample.css" />
        <!-- Scriptスロット（jQueryとアコーディオン） -->
        <script
          slot="script"
          src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"
        ></script>
        <script slot="script" src="./js/accordion.js"></script>
      </zcode-studio>
    </div>

    <div class="l-footer l-footer--dev">
      <h1>専用パーツを編集する画面（zcode-studio）</h1>
      <p>専用パーツ・専用CSS・専用画像のみ編集可</p>
    </div>

    <!-- リセットボタン -->
    <div id="reset-controls-fixed" class="reset-controls-fixed">
      <button id="reset-data-btn" class="reset-btn" aria-label="リセット">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
        <span>リセット</span>
      </button>
    </div>

    <!-- 共通JavaScript -->
    <script src="./js/common.js"></script>
    <!-- メインスクリプト -->
    <script type="module" src="/src/index.ts"></script>

    <script>
      let studio = null;

      async function init() {
        await waitForStudio();
        setTimeout(() => {
          studio = document.getElementById('test-cms');
          if (studio) {
            ZeroCodeCommon.StorageManager.ensureSampleDataIfNeeded('test-cms');
            ZeroCodeCommon.StorageManager.applyToComponent('test-cms');

            const resetBtn = document.getElementById('reset-data-btn');
            if (resetBtn) {
              resetBtn.addEventListener('click', () => {
                if (confirm('すべてのデータをリセットしますか？この操作は取り消せません。')) {
                  ZeroCodeCommon.StorageManager.clear('test-cms');
                  ZeroCodeCommon.StorageManager.saveSampleData('test-cms');
                  window.location.reload();
                }
              });
            }
          }
        }, 100);
      }

      function waitForStudio() {
        return new Promise((resolve) => {
          if (customElements.get('zcode-studio')) {
            resolve();
          } else {
            customElements.whenDefined('zcode-studio').then(resolve);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
