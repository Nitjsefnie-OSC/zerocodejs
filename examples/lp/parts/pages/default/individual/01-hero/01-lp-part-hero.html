<section class="hero">
  <div class="hero__bg" style="background-image: url({$bg_image:hero-bg:image})"></div>
  <div class="hero__inner">
    <div class="hero__label" z-if="show_label">{$label:DX Consulting Partner}</div>
    <div class="hero__title" z-tag="$tag:h1|h2|div">{$title:キャッチコピーを入力}</div>
    <div class="hero__divider"></div>
    <div class="hero__desc">{$desc:説明文を入力:textarea}</div>
    <div class="hero__actions">
      <a href="{$link_btn:#contact}" class="btn btn--white btn--lg">{$btn_text:ボタンテキスト}</a>
    </div>
  </div>
</section>
