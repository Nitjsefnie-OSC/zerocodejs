<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理画面 — ZeroCode.js LP Example</title>
    <link rel="stylesheet" href="/css/dev.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages/default.css" id="lp-page-css" />
  </head>
  <body>
    <div class="dev-header">
      <div class="dev-header__inner">
        <div class="dev-header__title">ZeroCode.js — 管理画面</div>
        <div class="dev-header__desc">
          <label for="page-select">ページ:</label>
          <select id="page-select" class="dev-header__select"></select>
        </div>
        <a href="#" id="pub-link" class="dev-header__link">公開ページを表示</a>
      </div>
    </div>

    <!--
      共通・個別のパーツは parts/ のファイルで管理しているため、パーツ管理では表示とプレビューだけにする。
      画像は hooks.uploadImage で、追加した時点でサーバー（public/uploads/）に保存する
    -->
    <zcode-editor
      id="editor"
      locale="ja"
      use-shadow-dom="false"
      config='{"studio":{"fileManagedCategories":["common","individual"]},"images":{"accept":"image/png,image/jpeg,image/gif,image/webp,image/avif","maxSize":5242880}}'
    >
    </zcode-editor>

    <div class="dev-footer">
      <div class="dev-footer__inner">
        パーツ: <code>parts/</code> のファイル（保存すると自動でまとめ直す。反映は再読み込み） /
        ページ: <code id="store-path">data/common.json + data/pages/.../page.json</code>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3.5/dist/vue.global.prod.js"></script>
    <script src="/dist/zerocode.umd.js"></script>
    <link rel="stylesheet" href="/dist/zerocodejs.css" />
    <script src="/js/zerocode-api.js"></script>
    <script>
      (function () {
        var editor = document.getElementById('editor');
        var pageSelect = document.getElementById('page-select');
        var pubLink = document.getElementById('pub-link');
        var storePathEl = document.getElementById('store-path');

        editor.hooks = {
          uploadImage: function (file) {
            return fetch('/api/upload', {
              method: 'POST',
              headers: { 'Content-Type': file.type, 'X-File-Name': encodeURIComponent(file.name) },
              body: file
            }).then(function (res) {
              return res.json().then(function (body) {
                if (!res.ok || !body.ok) throw new Error(body.error || 'upload failed');
                return { id: body.id, name: body.name, url: body.url };
              });
            });
          },
          listImages: function () {
            return fetch('/api/media').then(function (res) {
              if (!res.ok) throw new Error('media list failed');
              return res.json();
            });
          }
        };

        function getPage() {
          var match = window.location.pathname.match(/^\/edit(?:\/([^/]+))?\/?$/);
          return match && match[1] ? match[1] : 'default';
        }

        var PAGE_LABELS = {
          default: 'トップ',
          campaign: 'キャンペーンLPの例',
          feature: '特集LPの例'
        };
        function getPageLabel(name) {
          return PAGE_LABELS[name] || name;
        }

        function setPage(page, replace) {
          var path = page === 'default' ? '/edit' : '/edit/' + encodeURIComponent(page);
          if (replace) {
            window.history.replaceState({}, '', path);
          } else {
            window.history.pushState({}, '', path);
          }
          editor.setAttribute('data-current-page', page);
          var pageCssLink = document.getElementById('lp-page-css');
          if (pageCssLink) pageCssLink.href = '/css/pages/' + page + '.css';
          storePathEl.textContent =
            'data/common.json + ' +
            (page === 'default'
              ? 'data/pages/default/page.json'
              : 'data/pages/' + page + '/page.json');
          pubLink.href = page === 'default' ? '/' : '/lp/' + page + '/';
        }

        function loadPages() {
          return fetch('/api/pages')
            .then(function (res) {
              return res.json();
            })
            .then(function (names) {
              pageSelect.innerHTML = '';
              names.forEach(function (name) {
                var opt = document.createElement('option');
                opt.value = name;
                opt.textContent = getPageLabel(name) + (name === 'default' ? ' (default)' : '');
                pageSelect.appendChild(opt);
              });
              var page = getPage();
              if (names.indexOf(page) === -1) page = 'default';
              pageSelect.value = page;
              setPage(page, true);
            });
        }

        function loadData() {
          var page = getPage();
          return fetch('/api/data?page=' + encodeURIComponent(page))
            .then(function (res) {
              if (!res.ok) throw new Error('Failed to load');
              return res.json();
            })
            .then(function (data) {
              ZeroCodeApi.applyDataToComponent(editor, data);
            });
        }

        function syncSelectFromPath() {
          var page = getPage();
          if (pageSelect.value !== page) pageSelect.value = page;
        }

        function init() {
          ZeroCodeApi.setupApiSaveListeners();
          loadPages()
            .then(function () {
              return loadData();
            })
            .catch(function (err) {
              console.error('Failed to load:', err);
            });
        }

        pageSelect.addEventListener('change', function () {
          setPage(pageSelect.value, false);
          loadData();
        });

        window.addEventListener('popstate', function () {
          syncSelectFromPath();
          setPage(getPage(), true);
          loadData();
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            customElements.whenDefined('zcode-editor').then(init);
          });
        } else {
          customElements.whenDefined('zcode-editor').then(init);
        }
      })();
    </script>
  </body>
</html>
